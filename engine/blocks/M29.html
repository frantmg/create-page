<!--meta {"id": "M29", "name": "Appointment CTA with form", "slots": {"h2": "headline:6", "lede": "sentence:10", "bullets": "list:2:4", "locations": "fixed-list:[Location 1]|[Location 2]"}} -->
<style>
.m29 { background: var(--tint-low); padding: var(--space-5) 0; scroll-margin-top: var(--header-h); }
.m29 .grid { row-gap: var(--space-4); align-items: start; }
.m29 .lede { margin-top: var(--space-2); font-size: var(--text-lead); color: var(--md-sys-color-on-surface-variant); }
.m29 .talk { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); }
.m29 .talk a { display: inline-flex; align-items: center; min-height: 48px; font-family: var(--font-display); font-stretch: var(--display-stretch); font-weight: 600; font-size: var(--text-h4); }
.m29 .form-card { background: var(--md-sys-color-surface-container-lowest); padding: var(--space-4) var(--space-3); border-radius: var(--radius-card); box-shadow: var(--shadow-raised); display: grid; gap: var(--space-3); }
.m29 .form-card .btn { width: 100%; }
.m29 .small { max-width: none; font-size: var(--text-caption); color: var(--md-sys-color-on-surface-variant); }
.m29 .small a { display: inline-flex; align-items: center; min-height: 44px; }
@media (min-width: 900px) { .m29 { padding: var(--space-6) 0; } .m29 .text { grid-column: 1 / span 5; } .m29 .form-card { grid-column: 7 / -1; padding: var(--space-4); } }
</style>
<template>
<section data-block="{{_block}}" class="m29" id="book" aria-labelledby="{{_id}}-h">
  <div class="container grid">
    <div class="text">
      <h2 id="{{_id}}-h">{{h2}}</h2>
      <p class="lede">{{lede}}</p>
      {{#bullets.0}}<ul class="checks">{{#bullets}}<li>{{{_check}}}{{.}}</li>{{/bullets}}</ul>{{/bullets.0}}
      <p class="talk"><span>Prefer to talk?</span><a href="{{tel}}">{{cta_secondary}} {{phone}}</a></p>
    </div>
    <!-- HIPAA-compliant form endpoint required -->
    <form class="form-card" action="#" method="post" aria-labelledby="{{_id}}-h">
      <div class="field"><label for="{{_id}}-name">First name <span>(required)</span></label><input id="{{_id}}-name" name="first_name" type="text" autocomplete="given-name" required></div>
      <div class="field"><label for="{{_id}}-phone">Phone <span>(required)</span></label><input id="{{_id}}-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required></div>
      <div class="field"><label for="{{_id}}-loc">Preferred location</label><select id="{{_id}}-loc" name="location"><option value="">Select a location</option>{{#locations}}<option>{{.}}</option>{{/locations}}</select></div>
      <button class="btn" type="submit">{{cta_primary}}</button>
      <p class="small">Please don't include medical details. <a href="#">Privacy policy</a></p>
    </form>
  </div>
</section>
</template>
