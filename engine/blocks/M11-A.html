<!--meta {"id": "M11-A", "name": "Steps", "slots": {"h2": "headline:5", "lead": "sentence:9", "steps": "items:3:title=label:3;text=sentence:10"}} -->
<style>
.m11a { background: var(--steps-bg); padding: var(--space-5) 0; }
.m11a .head p { margin-top: var(--space-2); max-width: none; color: var(--md-sys-color-on-surface-variant); }
.m11a ol { list-style: none; margin: var(--space-4) 0 0; padding: 0; display: grid; gap: var(--space-4); position: relative; }
.m11a li { position: relative; display: grid; grid-template-columns: 4.5rem 1fr; column-gap: var(--space-2); }
.m11a .num { grid-row: span 2; font-family: var(--font-display); font-stretch: var(--display-stretch); font-size: var(--text-h2); font-weight: var(--display-weight); line-height: 1; color: var(--num-color); }
.m11a li p { margin-top: var(--space-1); color: var(--md-sys-color-on-surface-variant); }
.m11a li:not(:last-child)::before { content: ""; position: absolute; left: 1.1rem; top: 3.25rem; bottom: calc(-1 * var(--space-4) + var(--space-1)); width: 2px; background: var(--num-color); opacity: .35; }
.m11a .cta { margin-top: var(--space-4); }
@media (min-width: 900px) {
  .m11a { padding: var(--space-6) 0; }
  .m11a .head { grid-column: 1 / span 6; }
  .m11a ol { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--grid-gutter); }
  .m11a li { grid-template-columns: 1fr; row-gap: var(--space-2); }
  .m11a .num { grid-row: auto; display: flex; align-items: center; gap: var(--space-2); }
  .m11a li:not(:last-child)::before { display: none; }
  .m11a li:not(:last-child) .num::after { content: ""; flex: 1; height: 2px; background: var(--num-color); opacity: .35; }
}
</style>
<template>
<section data-block="{{_block}}" class="m11a" aria-labelledby="{{_id}}-h">
  <div class="container grid">
    <div class="head">
      <h2 id="{{_id}}-h">{{h2}}</h2>
      {{#lead}}<p>{{lead}}</p>{{/lead}}
    </div>
    <ol>
      {{#steps}}<li><span class="num" aria-hidden="true">{{_n}}</span><h3><span class="visually-hidden">Step {{_n}}: </span>{{title}}</h3><p>{{text}}</p></li>{{/steps}}
    </ol>
    <div class="cta"><a class="btn" href="{{cta_href}}">{{cta_primary}}</a></div>
  </div>
</section>
</template>
