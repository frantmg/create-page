<!--meta {"id": "M28-A", "name": "CTA panel + photo", "slots": {"h2": "headline:6", "lead": "sentence:9", "image_brief": "image:Photo: the front desk team greeting a patient, 4:5"}} -->
<style>
.m28a { padding: var(--space-5) 0; }
.m28a .grid { row-gap: var(--space-3); }
.m28a .panel { background: var(--final-bg); color: var(--final-fg); padding: var(--space-4) var(--space-3); border-radius: var(--radius-card); --grain: var(--final-grain, .1); }
.m28a .panel :focus-visible { outline-color: var(--final-focus); }
.m28a .panel p { margin: var(--space-2) 0 var(--space-4); font-size: var(--text-lead); color: var(--final-muted); }
.m28a .btn-final { background: var(--final-btn-bg); color: var(--final-btn-fg); }
.m28a .photo { position: relative; aspect-ratio: 4 / 3; }
@media (min-width: 900px) {
  .m28a { padding: var(--space-6) 0; }
  .m28a .grid { align-items: stretch; }
  .m28a .panel { grid-column: 1 / span 7; padding: var(--space-5); display: flex; flex-direction: column; justify-content: center; }
  .m28a .photo { grid-column: 8 / -1; aspect-ratio: auto; min-height: 22rem; }
}
</style>
<template>
<section data-block="{{_block}}" class="m28a" aria-labelledby="{{_id}}-h">
  <div class="container grid">
    <div class="panel grain">
      <h2 id="{{_id}}-h">{{h2}}</h2>
      <p>{{lead}}</p>
      <div class="actions">
        <a class="btn btn-final" href="{{cta_href}}">{{cta_primary}}</a>
        <a class="btn btn-ghost" href="{{tel}}">{{cta_secondary}}</a>
      </div>
    </div>
    {{{_photo}}}
  </div>
</section>
</template>
