<!--meta {"id": "M10", "name": "Stats", "slots": {"h2": "headline:5", "stats": "stats:4:6"}} -->
<style>
.m10 { padding: var(--space-5) 0; }
.m10 .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4) var(--grid-gutter); margin: var(--space-4) 0 0; align-items: start; }
.m10 .stat { display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: var(--space-1); padding-top: var(--space-2); border-top: 2px solid var(--rule); }
.m10 dd { margin: 0; font-family: var(--font-display); font-stretch: var(--display-stretch); font-weight: var(--display-weight); font-size: var(--text-h2); line-height: 1; color: var(--stat-big); }
.m10 .stat:first-child dd { font-size: var(--text-h1); }
.m10 dt { color: var(--md-sys-color-on-surface-variant); max-width: 24ch; }
@media (min-width: 900px) { .m10 { padding: var(--space-6) 0; } .m10 .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
<template>
<section data-block="{{_block}}" class="m10" aria-labelledby="{{_id}}-h">
  <div class="container grid">
    <h2 id="{{_id}}-h">{{h2}}</h2>
    <dl class="stats">
      {{#stats}}<div class="stat"><dt>{{label}}</dt><dd>{{value}}</dd></div>{{/stats}}
    </dl>
  </div>
</section>
</template>
