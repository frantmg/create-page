<!--meta {"id": "M28-B", "name": "CTA band, brand gradient", "slots": {"h2": "headline:6", "lead": "sentence:9"}} -->
<style>
.m28b { color: var(--final-fg); background: var(--final-bg); padding: var(--space-5) 0; --grain: .12; }
.m28b :focus-visible { outline-color: var(--final-focus); }
.m28b .grid { row-gap: var(--space-3); align-items: center; }
.m28b p { margin-top: var(--space-1); font-size: var(--text-lead); color: var(--final-muted); }
.m28b .btn-final { background: var(--final-btn-bg); color: var(--final-btn-fg); }
@media (min-width: 900px) { .m28b .text { grid-column: 1 / span 7; } .m28b .actions { grid-column: 8 / -1; justify-content: flex-end; } }
</style>
<template>
<section data-block="{{_block}}" class="m28b grain" aria-labelledby="{{_id}}-h">
  <div class="container grid">
    <div class="text">
      <h2 id="{{_id}}-h">{{h2}}</h2>
      <p>{{lead}}</p>
    </div>
    <div class="actions">
      <a class="btn btn-final" href="{{cta_href}}">{{cta_primary}}</a>
      <a class="btn btn-ghost" href="{{tel}}">{{cta_secondary}}</a>
    </div>
  </div>
</section>
</template>
