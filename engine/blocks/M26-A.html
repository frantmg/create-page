<!--meta {"id": "M26-A", "name": "Single big testimonial", "slots": {"quote": "sentence:24", "name": "fixed:[First name, last initial]", "detail": "fixed:[Treatment] with [Provider name]", "vary": "fixed:Results vary."}} -->
<style>
.m26a { background: var(--story-bg); color: var(--story-fg); padding: var(--space-5) 0; }
.m26a :focus-visible { outline-color: var(--story-focus); }
.m26a figure { margin: 0; }
.m26a blockquote { margin: 0; }
.m26a blockquote p { max-width: none; font-family: var(--font-display); font-stretch: var(--display-stretch); font-size: var(--text-h2); font-weight: 500; line-height: var(--lh-heading); letter-spacing: var(--heading-tracking); text-wrap: pretty; }
.m26a blockquote p::before { content: "\201C"; color: var(--story-accent); }
.m26a blockquote p::after { content: "\201D"; color: var(--story-accent); }
.m26a figcaption { width: fit-content; max-width: 100%; margin-top: var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); color: var(--story-muted); }
.m26a cite { font-style: normal; font-weight: 600; color: var(--story-fg); }
.m26a .vary { max-width: none; margin-top: var(--space-3); font-size: var(--text-caption); color: var(--story-small); }
@media (min-width: 900px) { .m26a { padding: var(--space-6) 0; } .m26a figure { grid-column: 2 / span 8; } }
</style>
<template>
<section data-block="{{_block}}" class="m26a" aria-label="Patient story">
  <div class="container grid">
    <figure>
      <blockquote><p>{{quote}}</p></blockquote>
      <figcaption><cite>{{name}}</cite><span>{{detail}}</span></figcaption>
      <p class="vary">{{vary}}</p>
    </figure>
  </div>
</section>
</template>
