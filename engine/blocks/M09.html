<!--meta {"id": "M09", "name": "Icon list benefits", "slots": {"h2": "headline:6", "intro": "sentence:10", "items": "items:6:title=label:3;text=sentence:9"}} -->
<style>
.m09 { padding: var(--space-5) 0; }
.m09 .grid { row-gap: var(--space-3); }
.m09 .intro p { margin-top: var(--space-2); color: var(--md-sys-color-on-surface-variant); }
.m09 ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2) var(--grid-gutter); }
.m09 li { display: grid; grid-template-columns: 28px 1fr; gap: var(--space-2); padding-top: var(--space-2); border-top: 2px solid var(--rule); }
.m09 li svg { width: 28px; height: 28px; color: var(--md-sys-color-primary); }
.m09 li h3 { font-size: var(--text-h4); }
.m09 li p { margin-top: 0.25rem; color: var(--md-sys-color-on-surface-variant); }
@media (min-width: 600px) { .m09 ul { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 900px) {
  .m09 { padding: var(--space-6) 0; }
  .m09 .intro { grid-column: 1 / span 4; }
  .m09 ul { grid-column: 6 / -1; row-gap: var(--space-4); }
}
</style>
<template>
<section data-block="{{_block}}" class="m09" aria-labelledby="{{_id}}-h">
  <div class="container grid">
    <div class="intro">
      <h2 id="{{_id}}-h">{{h2}}</h2>
      {{#intro}}<p>{{intro}}</p>{{/intro}}
    </div>
    <ul>
      {{#items}}<li>{{{_check}}}<div><h3>{{title}}</h3><p>{{text}}</p></div></li>{{/items}}
    </ul>
  </div>
</section>
</template>
