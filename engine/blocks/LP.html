<!--meta {"id": "LP", "name": "Landing header (logo, phone, main action)", "slots": {}} -->
<style>
.lp-head { position: sticky; top: 0; z-index: 50; background: var(--header-bg); box-shadow: var(--header-line); backdrop-filter: saturate(1.4) blur(8px); }
.lp-head .bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-height: var(--header-h); }
.lp-head .acts { display: flex; align-items: center; gap: var(--space-1); }
.lp-head .call { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); min-width: 48px; min-height: 48px; color: var(--md-sys-color-primary); font-family: var(--font-display); font-stretch: var(--display-stretch); font-weight: 600; text-decoration: none; }
.lp-head .call svg { width: 22px; height: 22px; }
.lp-head .call .num { display: none; }
.lp-head .btn { min-height: 48px; padding: 0 var(--space-3); white-space: nowrap; }
.lp-head .wordmark { white-space: nowrap; font-size: clamp(1.125rem, 1rem + 0.6vw, 1.375rem); }
.lp-head.band-dark .call { color: inherit; }
@media (max-width: 359px) { .lp-head .btn { padding: 0 0.75rem; } .lp-head .acts { gap: 0; } .lp-head .wordmark { font-size: 1rem; } .lp-head .wordmark span + span { font-size: 0.75rem; } .lp-head .call { min-width: 44px; } }
@media (min-width: 720px) { .lp-head .acts { gap: var(--space-2); } .lp-head .call .num { display: inline; } }
</style>
<template>
<header class="lp-head {{header_class}}" data-block="LP">
  <div class="container bar">
    <a class="wordmark" href="#main" aria-label="{{practice}} home">{{{brand}}}</a>
    <div class="acts">
      <a class="call" href="{{tel}}">{{{_phone_icon}}}<span class="visually-hidden">{{cta_secondary}}</span><span class="num">{{phone}}</span></a>
      <a class="btn" href="{{cta_href}}">{{cta_primary}}</a>
    </div>
  </div>
</header>
</template>
